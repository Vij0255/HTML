    <body>
        <p>preタグ (Preformatted Text)</p>

        <pre>
・整形済テキストの意味。
・preタグで囲われた文字は入力されたソースのままHTMLに表示されること
になります。つまり、preタグの間にほかのタグを入力しても、そのタ
グがそのままの形で表示される。
・&lt;pre&gt;
    この間の文は、そのままの形で表示されます。
    &lt;/pre&gt;
</pre
        >
