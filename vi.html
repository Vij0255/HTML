<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Photos of Mountains</title>

        <style>
            /* General page styling */
            body {
                font-family: Arial, sans-serif;
                background-color: #eaf4f4;
                color: #263238;
                margin: 0;
                padding: 30px;
                line-height: 1.7;
            }

            /* Main heading */
            h1 {
                text-align: center;
                color: #ffffff;
                background-color: #245c4a;
                padding: 25px;
                border-radius: 12px;
            }

            /* Second heading */
            h2 {
                color: #246b5b;
                text-align: center;
                margin-top: 30px;
            }

            /* Mountain images */
            img {
                width: 30%;
                height: 200px;
                object-fit: cover;
                border-radius: 12px;
                margin: 1%;
                box-shadow: 0 4px 10px #00000030;
                transition: transform 0.3s;
            }

            /* Image hover effect */
            img:hover {
                transform: scale(1.05);
            }

            /* Link styling */
            a {
                display: inline-block;
                color: white;
                background-color: #246b5b;
                padding: 10px 18px;
                text-decoration: none;
                border-radius: 6px;
            }

            /* Link hover effect */
            a:hover {
                background-color: #163f35;
            }

            /* About Mountains heading */
            h3 {
                color: #246b5b;
                border-bottom: 2px solid #246b5b;
                padding-bottom: 8px;
                margin-top: 35px;
            }

            /* Paragraph styling */
            p {
                font-size: 16px;
            }

            /* Mobile screen styling */
            @media (max-width: 600px) {
                body {
                    padding: 15px;
                }

                img {
                    width: 100%;
                    height: 220px;
                    margin: 10px 0;
                }
            }
        </style>
    </head>

    <body>
        <h1>This is my second site</h1>

        <h2>Photos of Mountains</h2>

        <img
            src="https://images.pexels.com/photos/67517/pexels-photo-67517.jpeg?cs=srgb&dl=landscape-mountains-nature-67517.jpg&fm=jpg"
            alt="Mountains"
        />

        <h3>About Mountains</h3>

        <p>
            Mountains are beautiful natural landscapes. They have high peaks,
            fresh air and amazing views. Many people enjoy visiting mountains
            for hiking, photography and travelling.
        </p>

        <h3>Learn More</h3>

        <a href="https://en.wikipedia.org/wiki/Mountain" target="_blank">
            Read More About Mountains
        </a>
    </body>
</html>
